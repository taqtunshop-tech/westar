<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="westar-app/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ozon Dashboard — Westar</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'], mono: ['JetBrains Mono','monospace'] } } }
}
</script>
<style>
:root { --gold:#FDB913; --bg:#08090d; --surface:#0f1117; --border:#1e2230; }
body { background:var(--bg); color:#e5e7eb; font-family:'Inter',sans-serif; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:12px; }
.badge-active { background:rgba(74,222,128,.1); color:#4ade80; border:1px solid rgba(74,222,128,.3); border-radius:6px; padding:2px 8px; font-size:11px; }
.badge-hidden { background:rgba(239,68,68,.1); color:#ef4444; border:1px solid rgba(239,68,68,.3); border-radius:6px; padding:2px 8px; font-size:11px; }
.btn-primary { background:var(--gold); color:#000; font-weight:600; border-radius:8px; padding:8px 16px; font-size:13px; cursor:pointer; transition:.2s; }
.btn-primary:hover { opacity:.85; }
.btn-ghost { background:transparent; border:1px solid var(--border); color:#9ca3af; border-radius:8px; padding:8px 14px; font-size:12px; cursor:pointer; transition:.2s; }
.btn-ghost:hover { border-color:#6b7280; color:#e5e7eb; }
.acc-tab { border-radius:8px; padding:10px 16px; cursor:pointer; transition:.2s; border:1px solid transparent; font-size:13px; }
.acc-tab.active { border-color:var(--gold); background:rgba(253,185,19,.08); }
.acc-tab:hover:not(.active) { background:#1a1d27; }
input[type=number] { background:#0a0b0f; border:1px solid var(--border); border-radius:6px; padding:4px 8px; color:#e5e7eb; font-size:13px; width:100px; text-align:right; }
input[type=number]:focus { outline:none; border-color:var(--gold); }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; padding:10px 12px; color:#6b7280; font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--border); }
td { padding:10px 12px; border-bottom:1px solid rgba(30,34,48,.8); vertical-align:middle; }
tr:hover td { background:rgba(255,255,255,.02); }
.loader { border:2px solid var(--border); border-top-color:var(--gold); border-radius:50%; width:20px; height:20px; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.tag-changed { background:rgba(253,185,19,.15); color:var(--gold); border-radius:4px; padding:1px 6px; font-size:10px; font-family:monospace; }
</style>
</head>
<body class="min-h-screen">

<!-- Хедер -->
<header style="border-bottom:1px solid var(--border); padding:0 24px; height:60px; display:flex; align-items:center; justify-content:space-between; background:rgba(8,9,13,.9); backdrop-filter:blur(10px); position:sticky; top:0; z-index:50;">
  <div style="display:flex; align-items:center; gap:12px;">
    <div style="width:28px; height:28px; background:var(--gold); border-radius:6px; display:flex; align-items:center; justify-content:center;">
      <span style="font-weight:700; color:#000; font-size:13px;">W</span>
    </div>
    <span style="font-weight:600; letter-spacing:.05em;">WESTAR</span>
    <span style="color:var(--border); margin:0 4px;">|</span>
    <nav style="display:flex; align-items:center; gap:2px; font-size:12px;">
      <a href="/index.html" style="color:#9ca3af; padding:4px 8px; border-radius:6px; text-decoration:none; transition:.2s;" onmouseover="this.style.color='#FDB913'; this.style.background='rgba(255,255,255,.05)'" onmouseout="this.style.color='#9ca3af'; this.style.background='transparent'">Каталог</a>
      <a href="/pulse.html" style="color:#9ca3af; padding:4px 8px; border-radius:6px; text-decoration:none; transition:.2s;" onmouseover="this.style.color='#FDB913'; this.style.background='rgba(255,255,255,.05)'" onmouseout="this.style.color='#9ca3af'; this.style.background='transparent'">Пульт</a>
      <a href="/admin.html" style="color:#9ca3af; padding:4px 8px; border-radius:6px; text-decoration:none; transition:.2s;" onmouseover="this.style.color='#FDB913'; this.style.background='rgba(255,255,255,.05)'" onmouseout="this.style.color='#9ca3af'; this.style.background='transparent'">Админ</a>
      <a href="/dashboard.html" style="color:#FDB913; padding:4px 8px; border-radius:6px; background:rgba(253,185,19,.08); border:1px solid rgba(253,185,19,.3); text-decoration:none;">Dashboard</a>
    </nav>
    <span style="color:var(--border); margin:0 4px;">|</span>
    <span style="color:#6b7280; font-size:13px;">Ozon Dashboard</span>
  </div>
  <div style="display:flex; align-items:center; gap:12px;">
    <span id="serverStatus" style="font-size:12px; color:#6b7280; display:flex; align-items:center; gap:6px;">
      <span style="width:8px; height:8px; border-radius:50%; background:#6b7280; display:inline-block;" id="statusDot"></span>
      <span id="statusText">Подключение...</span>
    </span>
    <button class="btn-ghost" onclick="loadCurrentAccount()">⟳ Обновить</button>
    <a href="dashboard-full.html" class="btn-primary" style="text-decoration:none; font-size:12px;">📊 Полный дашборд</a>
    <a href="price-monitor.html" class="btn-ghost" style="text-decoration:none; font-size:12px;">💰 Цены</a>
  </div>
</header>

<div style="max-width:1400px; margin:0 auto; padding:24px;">

  <!-- Аккаунты -->
  <div id="accountTabs" style="display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap;">
    <div style="color:#6b7280; font-size:13px; display:flex; align-items:center; padding:10px 4px;">Загрузка аккаунтов...</div>
  </div>

  <!-- Статистика -->
  <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:24px;" id="statsCards">
    <div class="card" style="padding:20px;">
      <div style="font-size:11px; color:#6b7280; margin-bottom:8px; text-transform:uppercase; letter-spacing:.05em;">Всего товаров</div>
      <div style="font-size:28px; font-weight:600;" id="statTotal">—</div>
    </div>
    <div class="card" style="padding:20px;">
      <div style="font-size:11px; color:#6b7280; margin-bottom:8px; text-transform:uppercase; letter-spacing:.05em;">Активных</div>
      <div style="font-size:28px; font-weight:600; color:#4ade80;" id="statActive">—</div>
    </div>
    <div class="card" style="padding:20px;">
      <div style="font-size:11px; color:#6b7280; margin-bottom:8px; text-transform:uppercase; letter-spacing:.05em;">Скрытых</div>
      <div style="font-size:28px; font-weight:600; color:#ef4444;" id="statHidden">—</div>
    </div>
    <div class="card" style="padding:20px;">
      <div style="font-size:11px; color:#6b7280; margin-bottom:8px; text-transform:uppercase; letter-spacing:.05em;">Изменено цен</div>
      <div style="font-size:28px; font-weight:600; color:var(--gold);" id="statChanged">0</div>
    </div>
  </div>

  <!-- Панель управления -->
  <div class="card" style="padding:16px 20px; margin-bottom:16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
    <input type="text" id="searchInput" placeholder="Поиск по артикулу, названию..." style="background:#0a0b0f; border:1px solid var(--border); border-radius:8px; padding:8px 12px; color:#e5e7eb; font-size:13px; width:260px;" oninput="filterTable()">
    <select id="visibilityFilter" onchange="filterTable()" style="background:#0a0b0f; border:1px solid var(--border); border-radius:8px; padding:8px 12px; color:#e5e7eb; font-size:13px;">
      <option value="">Все статусы</option>
      <option value="active">Активные</option>
      <option value="hidden">Скрытые</option>
    </select>
    <div style="margin-left:auto; display:flex; gap:8px;">
      <button class="btn-ghost" id="applyPricesBtn" onclick="applyPriceChanges()" style="display:none;">💾 Сохранить цены (Ozon)</button>
      <button class="btn-primary" onclick="exportToCSV()">↓ Экспорт CSV</button>
    </div>
  </div>

  <!-- Таблица товаров -->
  <div class="card" style="overflow:hidden;">
    <div id="loadingState" style="padding:48px; text-align:center; color:#6b7280;">
      <div class="loader" style="margin:0 auto 16px;"></div>
      <div style="font-size:13px;">Загрузка данных из Ozon...</div>
    </div>
    <div id="tableWrap" style="display:none; overflow-x:auto; max-height:600px; overflow-y:auto;">
      <table id="productsTable">
        <thead style="position:sticky; top:0; background:var(--surface); z-index:1;">
          <tr>
            <th style="width:40px;"><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)"></th>
            <th>Изображение</th>
            <th>Артикул</th>
            <th>Название</th>
            <th>Статус</th>
            <th>Текущая цена</th>
            <th>Новая цена (ред.)</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="productsBody"></tbody>
      </table>
    </div>
    <div id="emptyState" style="display:none; padding:48px; text-align:center; color:#6b7280; font-size:13px;">Нет товаров</div>
  </div>

</div>

<!-- Уведомление -->
<div id="toast" style="position:fixed; bottom:24px; right:24px; padding:12px 20px; border-radius:10px; font-size:13px; font-weight:500; display:none; z-index:1000; max-width:320px;"></div>

<script>
const API = window.location.hostname === 'localhost' ? 'http://localhost:3000' : window.location.origin;
let currentAccount = null;
let allProducts = [];
let filteredProducts = [];
let priceChanges = {};

// ── Инициализация ──────────────────────────────────────────────
async function init() {
  try {
    const res = await fetch(`${API}/api/ozon/accounts`);
    if (!res.ok) throw new Error('Сервер недоступен');
    const data = await res.json();
    renderAccountTabs(data.accounts);
    if (data.accounts.length > 0) {
      selectAccount(data.accounts[0].key);
    }
    setStatus(true);
  } catch(e) {
    setStatus(false);
    document.getElementById('accountTabs').innerHTML = `<div style="color:#ef4444; font-size:13px;">⚠ Сервер недоступен. Запустите: <code style="background:#1a1d27; padding:2px 6px; border-radius:4px;">node server.js</code></div>`;
    document.getElementById('loadingState').innerHTML = `<div style="color:#ef4444;">Не удалось подключиться к серверу.<br><span style="font-size:12px; color:#6b7280;">Убедитесь что запущен node server.js</span></div>`;
  }
}

function setStatus(ok) {
  document.getElementById('statusDot').style.background = ok ? '#4ade80' : '#ef4444';
  document.getElementById('statusText').textContent = ok ? 'Сервер онлайн' : 'Нет подключения';
}

// ── Аккаунты ──────────────────────────────────────────────────
function renderAccountTabs(accounts) {
  document.getElementById('accountTabs').innerHTML = accounts.map(acc => `
    <div class="acc-tab" id="tab-${acc.key}" onclick="selectAccount('${acc.key}')"
      style="display:flex; align-items:center; gap:8px;">
      <span style="width:10px; height:10px; border-radius:50%; background:${acc.color}; flex-shrink:0;"></span>
      <span>${acc.name}</span>
      <span style="font-size:11px; color:#6b7280; font-family:monospace;">ID:${acc.clientId}</span>
    </div>
  `).join('');
}

function selectAccount(key) {
  currentAccount = key;
  document.querySelectorAll('.acc-tab').forEach(t => t.classList.remove('active'));
  const tab = document.getElementById(`tab-${key}`);
  if (tab) tab.classList.add('active');
  loadCurrentAccount();
}

async function loadCurrentAccount() {
  if (!currentAccount) return;
  priceChanges = {};
  document.getElementById('statChanged').textContent = '0';
  document.getElementById('applyPricesBtn').style.display = 'none';

  document.getElementById('loadingState').style.display = 'block';
  document.getElementById('tableWrap').style.display = 'none';
  document.getElementById('emptyState').style.display = 'none';

  try {
    const res = await fetch(`${API}/api/ozon/${currentAccount}/summary`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    allProducts = data.products || [];
    renderStats(allProducts);
    filterTable();
    document.getElementById('loadingState').style.display = 'none';
    if (allProducts.length === 0) {
      document.getElementById('emptyState').style.display = 'block';
    } else {
      document.getElementById('tableWrap').style.display = 'block';
    }
  } catch(e) {
    document.getElementById('loadingState').innerHTML = `<div style="color:#ef4444;">Ошибка загрузки: ${e.message}</div>`;
  }
}

// ── Статистика ─────────────────────────────────────────────────
function renderStats(products) {
  const active = products.filter(p => p.visible).length;
  const hidden = products.filter(p => !p.visible).length;
  document.getElementById('statTotal').textContent = products.length;
  document.getElementById('statActive').textContent = active;
  document.getElementById('statHidden').textContent = hidden;
}

// ── Таблица ────────────────────────────────────────────────────
function filterTable() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const vis = document.getElementById('visibilityFilter').value;
  filteredProducts = allProducts.filter(p => {
    const matchQ = !q || (p.offer_id||'').toLowerCase().includes(q) || (p.name||'').toLowerCase().includes(q);
    const matchV = !vis || (vis==='active' && p.visible) || (vis==='hidden' && !p.visible);
    return matchQ && matchV;
  });
  renderTable(filteredProducts);
}

function renderTable(products) {
  const body = document.getElementById('productsBody');
  if (products.length === 0) {
    body.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#6b7280; padding:32px;">Нет товаров</td></tr>';
    return;
  }
  body.innerHTML = products.slice(0, 500).map(p => {
    const img = p.primary_image || (p.images && p.images[0]) || '';
    const currentPrice = p.price || '0';
    const changed = priceChanges[p.product_id];
    return `
    <tr>
      <td><input type="checkbox" class="row-cb" data-id="${p.product_id}"></td>
      <td>
        ${img ? `<img src="${img}" style="width:44px; height:44px; object-fit:contain; border-radius:6px; background:#111;">` : `<div style="width:44px;height:44px;border-radius:6px;background:#1a1d27;display:flex;align-items:center;justify-content:center;font-size:10px;color:#4b5563;">нет</div>`}
      </td>
      <td style="font-family:monospace; font-size:12px; color:#9ca3af;">${p.offer_id || '—'}</td>
      <td style="max-width:280px;">
        <div style="font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${p.name||''}">${p.name || '—'}</div>
        <div style="font-size:11px; color:#6b7280; font-family:monospace;">ID: ${p.product_id}</div>
      </td>
      <td>${p.visible ? '<span class="badge-active">Активен</span>' : '<span class="badge-hidden">Скрыт</span>'}</td>
      <td style="font-weight:600; font-family:monospace;">
        ${formatPrice(currentPrice)}
        ${p.old_price && p.old_price !== '0' ? `<div style="font-size:11px; color:#6b7280; text-decoration:line-through;">${formatPrice(p.old_price)}</div>` : ''}
      </td>
      <td>
        <div style="display:flex; align-items:center; gap:6px;">
          <input type="number" value="${changed || currentPrice}" min="0" step="10"
            onchange="setPriceChange(${p.product_id}, this.value, '${currentPrice}')"
            id="price-${p.product_id}">
          ${changed ? `<span class="tag-changed">изм.</span>` : ''}
        </div>
      </td>
      <td>
        <button class="btn-ghost" onclick="openOzon('${p.offer_id}')" style="padding:5px 10px; font-size:11px;">↗ Ozon</button>
      </td>
    </tr>`;
  }).join('');
}

function formatPrice(v) {
  const n = parseFloat(v);
  if (!n || isNaN(n)) return '—';
  return new Intl.NumberFormat('ru-RU').format(n) + ' ₽';
}

// ── Изменение цен ─────────────────────────────────────────────
function setPriceChange(productId, newPrice, currentPrice) {
  const n = parseFloat(newPrice);
  const c = parseFloat(currentPrice);
  if (!isNaN(n) && n !== c && n > 0) {
    priceChanges[productId] = n;
  } else {
    delete priceChanges[productId];
  }
  const count = Object.keys(priceChanges).length;
  document.getElementById('statChanged').textContent = count;
  document.getElementById('applyPricesBtn').style.display = count > 0 ? 'block' : 'none';
}

async function applyPriceChanges() {
  const count = Object.keys(priceChanges).length;
  if (count === 0) return;
  if (!confirm(`Обновить ${count} цен на Ozon?`)) return;

  const prices = Object.entries(priceChanges).map(([product_id, price]) => ({
    product_id: parseInt(product_id),
    price: String(price),
    old_price: String(price)
  }));

  try {
    const res = await fetch(`${API}/api/ozon/${currentAccount}/prices`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prices })
    });
    const data = await res.json();
    showToast(`✅ Обновлено ${count} цен`, '#4ade80');
    priceChanges = {};
    document.getElementById('statChanged').textContent = '0';
    document.getElementById('applyPricesBtn').style.display = 'none';
    setTimeout(loadCurrentAccount, 1500);
  } catch(e) {
    showToast('❌ Ошибка: ' + e.message, '#ef4444');
  }
}

// ── Утилиты ───────────────────────────────────────────────────
function toggleSelectAll(cb) {
  document.querySelectorAll('.row-cb').forEach(r => r.checked = cb.checked);
}

function openOzon(offerId) {
  window.open(`https://seller.ozon.ru/app/products/list?offer_id=${offerId}`, '_blank');
}

function exportToCSV() {
  const rows = [['ID', 'Артикул', 'Название', 'Статус', 'Цена']];
  filteredProducts.forEach(p => {
    rows.push([p.product_id, p.offer_id, p.name, p.visible ? 'Активен' : 'Скрыт', p.price]);
  });
  const csv = rows.map(r => r.map(v => `"${(v||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `ozon-${currentAccount}-${Date.now()}.csv`; a.click();
  URL.revokeObjectURL(url);
}

function showToast(msg, color='#4ade80') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = color === '#4ade80' ? '#052e16' : '#2d0a0a';
  t.style.color = color;
  t.style.border = `1px solid ${color}33`;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3500);
}

init();
</script>
</body>
</html>
